<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>PDF Test</title>
<style>html,body{margin:0;background:#444;text-align:center}canvas{margin:10px auto;display:block;box-shadow:0 2px 12px #0008;background:#fff}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head><body>
<div id="pages"></div>
<script src="pdf.js"></script>
<script>
/* Loads the first stored checklist and renders its PDF for inspection. */
const SECTIONS = [["VCT Installation"],["Vestibule/Walk-Off Carpet Installation"],
  ["Sales Floor Carpet Installation"],["Fitting Room Flooring Installation"],
  ["Overall Project Status"]];
const list = JSON.parse(localStorage.getItem("punchChecklists.v1") || "[]");
if (list.length) {
  buildChecklistPDF(list[0]).then(async ({ blob, fileName }) => {
    document.title = fileName;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const vp = page.getViewport({ scale: 1.4 });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      document.getElementById("pages").appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  }).catch(e => document.body.innerHTML = "<pre style='color:#fff'>" + e.stack + "</pre>");
} else {
  document.body.innerHTML = "<p>No checklist in storage — open index.html?demo=1 first.</p>";
}
</script>
</body></html>
